<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online DevTools Pro</title>
    <style>
        :root {
            --color-canvas-default: #ffffff;
            --color-canvas-subtle: #f6f8fa;
            --color-border-default: #d0d7de;
            --color-fg-default: #24292f;
            --color-btn-text: #24292f;
            --color-btn-bg: #f6f8fa;
            --color-btn-border: rgba(27, 31, 36, 0.15);
            --color-btn-hover-bg: #f3f4f6;
            --color-btn-hover-border: rgba(27, 31, 36, 0.15);
            --color-accent-fg: #0969da;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            margin: 0;
            padding: 0;
            background-color: var(--color-canvas-default);
            color: var(--color-fg-default);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--color-border-default);
            background-color: var(--color-canvas-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo svg {
            fill: var(--color-fg-default);
        }

        .toolbar {
            display: flex;
            gap: 8px;
        }

        .btn {
            appearance: none;
            background-color: var(--color-btn-bg);
            border: 1px solid var(--color-btn-border);
            border-radius: 6px;
            box-shadow: 0 1px 0 rgba(27, 31, 36, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            color: var(--color-btn-text);
            cursor: pointer;
            display: inline-block;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            padding: 5px 16px;
            position: relative;
            transition: 0.2s cubic-bezier(0.3, 0, 0.5, 1);
            user-select: none;
            vertical-align: middle;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--color-btn-hover-bg);
            transition-duration: 0.1s;
        }

        .btn:active {
            background-color: hsla(220, 14%, 93%, 1);
            box-shadow: inset 0 0.15em 0.3em rgba(27, 31, 36, 0.15);
        }

        main {
            flex: 1;
            display: flex;
            padding: 24px;
            gap: 24px;
            overflow: hidden;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .editor-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-fg-default);
        }

        textarea {
            flex: 1;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 12px;
            padding: 12px;
            border: 1px solid var(--color-border-default);
            border-radius: 6px;
            resize: none;
            outline: none;
            background-color: var(--color-canvas-default);
            color: var(--color-fg-default);
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--color-accent-fg);
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3);
        }

        footer {
            padding: 12px 24px;
            font-size: 12px;
            color: #6e7781;
            border-top: 1px solid var(--color-border-default);
            text-align: center;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <svg height="24" viewBox="0 0 16 16" version="1.1" width="24" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
        Online DevTools Pro
    </div>
    <div class="toolbar">
        <button class="btn" onclick="formatJSON()">Format JSON</button>
        <button class="btn" onclick="minifyCSS()">Minify CSS</button>
        <button class="btn" onclick="prettifySQL()">SQL Prettifier</button>
    </div>
</header>

<main>
    <div class="editor-container">
        <div class="editor-label">Input</div>
        <textarea id="inputArea" placeholder="Paste your code here..."></textarea>
    </div>
    <div class="editor-container">
        <div class="editor-label">Output</div>
        <textarea id="outputArea" placeholder="Result will appear here..." readonly></textarea>
    </div>
</main>

<footer>
    &copy; 2026 Online DevTools Pro. Simple, secure, and efficient.
</footer>

<script>
    const inputArea = document.getElementById('inputArea');
    const outputArea = document.getElementById('outputArea');

    const DEFAULT_JSON = {
        "user": {
            "id": 1024,
            "name": "Alex Developer",
            "is_active": true,
            "roles": ["admin", "editor", "contributor"],
            "preferences": {
                "theme": "dark",
                "notifications": {
                    "email": true,
                    "push": false,
                    "frequency": "daily"
                },
                "languages": [
                    { "code": "en-US", "proficiency": "native" },
                    { "code": "zh-CN", "proficiency": "intermediate" },
                    { "code": "ja-JP", "proficiency": "beginner" }
                ]
            },
            "last_login": "2026-02-02T14:30:00Z",
            "metadata": {
                "created_at": "2024-01-15T08:00:00Z",
                "login_count": 42
            }
        },
        "session": {
            "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
            "expires_in": 3600
        }
    };

    window.onload = () => {
        inputArea.value = JSON.stringify(DEFAULT_JSON); // Start with unformatted single line to show effect
    };

    function formatJSON() {
        try {
            const raw = inputArea.value;
            // Handle if it's already an object or a string
            const parsed = JSON.parse(raw);
            outputArea.value = JSON.stringify(parsed, null, 4);
        } catch (e) {
            outputArea.value = "Error: Invalid JSON\n" + e.message;
        }
    }

    function minifyCSS() {
        const css = inputArea.value;
        // Simple regex based minification
        const minified = css
            .replace(/\/\*[\s\S]*?\*\//g, '') // Remove comments
            .replace(/\s+/g, ' ') // Collapse whitespace
            .replace(/\s*([{}:;,])\s*/g, '$1') // Remove space around symbols
            .replace(/;\}/g, '}') // Remove last semicolon
            .trim();
        outputArea.value = minified;
    }

    function prettifySQL() {
        const sql = inputArea.value;
        const keywords = [
            "SELECT", "FROM", "WHERE", "AND", "OR", "ORDER BY", "GROUP BY", 
            "INSERT INTO", "VALUES", "UPDATE", "SET", "DELETE", "JOIN", 
            "LEFT JOIN", "RIGHT JOIN", "Tbale", "CREATE TABLE", "ALTER TABLE"
        ];
        
        // Very basic SQL formatter
        let formatted = sql;
        
        // Normalize spaces
        formatted = formatted.replace(/\s+/g, ' ');

        keywords.forEach(kw => {
            const regex = new RegExp(`\\b${kw}\\b`, 'gi');
            formatted = formatted.replace(regex, `\n${kw}`);
        });

        // Add indentation for readability logic could be complex, keeping it simple for now
        // Just ensuring new lines for main keywords
        
        outputArea.value = formatted.trim();
    }
</script>

</body>
</html>
